<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTuber Marketing List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#EEF0F4; --surface:#FFFFFF; --surface2:#F5F6FA; --surface3:#E9ECF3;
    --ink:#191C24; --muted:#5F6577; --faint:#8A90A2;
    --line:#D8DCE6; --line2:#E7EAF1;
    --accent:#4A56C9; --accent-b:#E7E9FA; --on-accent:#FFFFFF;
    --good:#1F7A55; --good-b:#DEF0E7;
    --warn:#A65F16; --warn-b:#FAECDA;
    --stop:#A33C46; --stop-b:#F8E4E6;
    --shadow:0 1px 2px rgba(25,28,36,.05), 0 8px 22px -14px rgba(25,28,36,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#12141C; --surface:#1A1D27; --surface2:#212533; --surface3:#272C3C;
      --ink:#E8EAF2; --muted:#98A0B4; --faint:#727A8F;
      --line:#2E3444; --line2:#252A38;
      --accent:#8E9BF5; --accent-b:#242A4A; --on-accent:#131629;
      --good:#5FC79A; --good-b:#16332A;
      --warn:#DDA062; --warn-b:#37291A;
      --stop:#E08A93; --stop-b:#372027;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground:#12141C; --surface:#1A1D27; --surface2:#212533; --surface3:#272C3C;
    --ink:#E8EAF2; --muted:#98A0B4; --faint:#727A8F;
    --line:#2E3444; --line2:#252A38;
    --accent:#8E9BF5; --accent-b:#242A4A; --on-accent:#131629;
    --good:#5FC79A; --good-b:#16332A;
    --warn:#DDA062; --warn-b:#37291A;
    --stop:#E08A93; --stop-b:#372027;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -14px rgba(0,0,0,.7);
  }

  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  img { max-width:100%; }
  [hidden] { display:none !important; }

  .shell { max-width:1420px; margin:0 auto; padding:20px 18px 40px; display:flex; flex-direction:column; gap:14px; }

  .masthead { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:19px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .kicker { margin:1px 0 0; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .toolbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  button {
    font-family:inherit; font-size:13px; font-weight:500; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:7px;
    padding:7px 12px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  button.primary:hover:not(:disabled) { filter:brightness(1.08); }
  button.ghost { background:transparent; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .saver { display:flex; align-items:center; gap:11px; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10.5px; color:var(--faint); }
  .slot { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .slot i { width:7px; height:7px; border-radius:50%; flex:none; border:1px solid var(--line); background:transparent; font-style:normal; }
  .slot.done i { background:var(--good); border-color:var(--good); }
  .slot.stale i { background:var(--warn); border-color:var(--warn); }
  .slot.busy i { background:var(--accent); border-color:var(--accent); }
  .slot b { font-weight:500; color:var(--muted); }
  .slot.done b { color:var(--ink); }
  .slot a { color:var(--accent); text-decoration:none; }
  .slot a:hover { text-decoration:underline; }
  @media (max-width:820px) { .saver { width:100%; order:9; } }

  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(128px,1fr)); gap:9px; }
  .stat { background:var(--surface); border:1px solid var(--line2); border-radius:9px; padding:10px 13px; box-shadow:var(--shadow); }
  .stat .lab { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .stat .val { font-size:22px; font-weight:600; line-height:1.25; margin-top:2px; font-variant-numeric:tabular-nums; }
  .stat .val small { font-size:12px; font-weight:400; color:var(--muted); }
  .stat.money .val { font-size:15px; font-family:"IBM Plex Mono", monospace; font-weight:500; }
  .stat.alert { border-color:var(--warn); background:var(--warn-b); }
  .stat.alert .lab, .stat.alert .val { color:var(--warn); }

  .split { display:grid; grid-template-columns:minmax(300px, 390px) 1fr; gap:13px; align-items:start; }
  .pane { background:var(--surface); border:1px solid var(--line2); border-radius:11px; box-shadow:var(--shadow); overflow:hidden; }

  .listhead { padding:11px 12px; border-bottom:1px solid var(--line2); display:flex; flex-direction:column; gap:8px; }
  .search { width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:8px 11px; color:var(--ink); font-family:inherit; font-size:13px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chip { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10.5px; padding:5px 9px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); }
  .chip[aria-pressed="true"] { background:var(--accent-b); border-color:var(--accent); color:var(--accent); }
  .sortrow { display:flex; gap:6px; align-items:center; }
  .sortsel { flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:6px 8px; color:var(--ink); font-family:"IBM Plex Mono", monospace; font-size:11px; }
  .count { font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--faint); white-space:nowrap; }
  .rangerow { display:flex; gap:6px; align-items:center; }
  .rangein { flex:1; width:100%; min-width:0; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:6px 8px; color:var(--ink); font-family:"IBM Plex Mono", monospace; font-size:11px; }
  .rangein:focus { border-color:var(--accent); background:var(--surface); outline:none; }
  .rangerow > span { color:var(--faint); font-size:11px; flex:none; }
  .rangerow > button { flex:none; padding:5px 9px; font-size:11px; font-family:"IBM Plex Mono", monospace; }
  .rangerow > button.on { background:var(--accent-b); border-color:var(--accent); color:var(--accent); }

  .list { max-height:min(62vh, 600px); overflow-y:auto; }
  .item {
    display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:9px;
    width:100%; text-align:left; padding:9px 12px;
    background:transparent; border:0; border-bottom:1px solid var(--line2); border-radius:0;
    cursor:pointer; font-family:inherit; font-size:13px; color:var(--ink);
  }
  .item:hover { background:var(--surface2); }
  .item[aria-current="true"] { background:var(--accent-b); }
  .item[aria-current="true"] .iname { color:var(--accent); }
  .item.prio { box-shadow:inset 3px 0 0 var(--accent); }
  /* status cukup diwakili titik warna di kanan, teks nggak usah diredupin */
  .istack { min-width:0; }
  .iname { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .imeta { font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .isub { font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .isub.unknown { color:var(--faint); font-style:italic; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .tag { font-family:"IBM Plex Mono", monospace; font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--surface2); }
  .tag.hit { border-color:var(--accent); color:var(--accent); background:var(--accent-b); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .dot.d-accent { background:var(--accent); } .dot.d-good { background:var(--good); }
  .dot.d-warn { background:var(--warn); } .dot.d-stop { background:var(--stop); }

  .dhead { padding:15px 18px; border-bottom:1px solid var(--line2); display:flex; align-items:flex-start; gap:10px; }
  .dhead .grow { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .dname { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; padding:4px 6px; margin:-4px 0 0 -6px; color:var(--ink); font-family:inherit; font-size:18px; font-weight:600; }
  .dname:hover { border-color:var(--line); }
  .dname:focus { border-color:var(--accent); background:var(--surface2); outline:none; }
  .dlink { width:100%; background:transparent; border:1px solid transparent; border-radius:6px; padding:3px 6px; margin-left:-6px; color:var(--muted); font-family:"IBM Plex Mono", monospace; font-size:11.5px; }
  .dlink:hover { border-color:var(--line); }
  .dlink:focus { border-color:var(--accent); background:var(--surface2); outline:none; }
  .go { flex:none; display:inline-grid; place-items:center; height:32px; padding:0 12px; border-radius:7px; border:1px solid var(--line); background:var(--surface2); color:var(--muted); text-decoration:none; font-size:12px; font-weight:500; white-space:nowrap; }
  .go:hover { color:var(--accent); border-color:var(--accent); }

  .dbody { padding:16px 18px 20px; display:flex; flex-direction:column; gap:13px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(148px,1fr)); gap:11px; }
  .field { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .field > label { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .in { width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:8px 10px; color:var(--ink); font-family:inherit; font-size:13px; }
  .in:focus { border-color:var(--accent); background:var(--surface); outline:none; }
  .in::placeholder { color:var(--faint); }
  .in.mono { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12px; }
  .in.num { font-variant-numeric:tabular-nums; }
  .in[type="number"] { -moz-appearance:textfield; }
  .in[type="number"]::-webkit-outer-spin-button,
  .in[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  textarea.in { resize:vertical; min-height:70px; line-height:1.6; }
  select.in { cursor:pointer; }
  .money { display:grid; grid-template-columns:1fr 90px; gap:8px; }
  .s-neutral { border-color:var(--line); }
  .s-accent { border-color:var(--accent); background:var(--accent-b); color:var(--accent); }
  .s-good { border-color:var(--good); background:var(--good-b); color:var(--good); }
  .s-warn { border-color:var(--warn); background:var(--warn-b); color:var(--warn); }
  .s-stop { border-color:var(--stop); background:var(--stop-b); color:var(--stop); }
  select.s-accent option, select.s-good option, select.s-warn option, select.s-stop option { color:var(--ink); background:var(--surface); }
  .drow { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:5px; border-top:1px solid var(--line2); }
  .kill { color:var(--faint); border-color:transparent; background:transparent; }
  .kill:hover { color:var(--stop); border-color:var(--stop); }

  .blank { padding:56px 24px; text-align:center; color:var(--faint); }
  .blank strong { display:block; color:var(--muted); font-weight:500; margin-bottom:4px; }

  .sheet { position:fixed; inset:0; background:rgba(10,12,18,.55); display:grid; place-items:center; padding:20px; z-index:50; }
  .sheetbox { background:var(--surface); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); width:min(680px,100%); max-height:88vh; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:13px; }
  .sheetbox h2 { margin:0; font-size:16px; font-weight:600; }
  .sheetbox p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
  .sheetbox a { color:var(--accent); }
  .sheetfoot { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .bucket { border:1px solid var(--line2); border-radius:9px; padding:11px 13px; background:var(--surface2); }
  .bucket h3 { margin:0 0 6px; font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:500; }
  .bucket ul { margin:0; padding-left:17px; font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--muted); max-height:150px; overflow-y:auto; line-height:1.75; }
  .bucket.new { border-color:var(--good); background:var(--good-b); }
  .bucket.new h3, .bucket.new ul { color:var(--good); }
  .bucket.dupe { border-color:var(--warn); background:var(--warn-b); }
  .bucket.dupe h3, .bucket.dupe ul { color:var(--warn); }

  .bar { height:6px; border-radius:999px; background:var(--surface3); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .log { font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--muted); max-height:180px; overflow-y:auto; line-height:1.8; }
  .log b { color:var(--good); font-weight:500; }
  .log i { color:var(--stop); font-style:normal; }

  code { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:11.5px; background:var(--surface2); border:1px solid var(--line2); border-radius:4px; padding:1px 5px; }

  .help { display:flex; flex-direction:column; gap:0; }
  .helprow { display:grid; grid-template-columns:132px 1fr; gap:14px; padding:9px 0; border-top:1px solid var(--line2); align-items:start; }
  .helprow:first-child { border-top:0; }
  .helprow dt { font-weight:500; font-size:13px; }
  .helprow dd { margin:0; color:var(--muted); font-size:12.5px; line-height:1.6; }
  .helpnote { border-left:2px solid var(--warn); background:var(--warn-b); color:var(--warn); padding:9px 12px; border-radius:0 7px 7px 0; font-size:12.5px; line-height:1.6; }
  @media (max-width:560px) { .helprow { grid-template-columns:1fr; gap:3px; } }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(14px); background:var(--ink); color:var(--ground); font-size:13px; padding:10px 18px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:70; max-width:90vw; }
  .toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:900px) { .split { grid-template-columns:1fr; } .list { max-height:44vh; } }
</style>
</head>
<body>


<div class="shell">

  <header class="masthead">
    <div>
      <h1>YouTuber Marketing List</h1>
      <p class="kicker">Database outreach kreator</p>
    </div>
    <div class="toolbar">
      <span class="saver" id="saver">
        <span class="slot" id="slotLocal"><i></i><b>browser</b> <span>&mdash;</span></span>
        <span class="slot" id="slotFile"><i></i><b>file</b> <span>&mdash;</span></span>
        <span class="slot" id="slotRepo"><i></i><b>repo</b> <span>&mdash;</span></span>
      </span>
      <button id="findBtn" class="primary">Cari Channel</button>
      <button id="fetchBtn">Lengkapi Data</button>
      <button id="scanBtn">Scan &amp; Tambah</button>
      <button id="sharedBtn" class="ghost">Muat Data Tim</button>
      <button id="addBtn" class="ghost">+ Kosong</button>
      <button id="openBtn" class="ghost">Buka&hellip;</button>
      <button id="csvBtn" class="ghost">CSV</button>
      <button id="pushBtn" title="Commit data.json ke repo, semua tim langsung lihat">Simpan ke Repo</button>
      <button id="saveAsBtn" class="ghost" title="Pilih lokasi file">Simpan Ke&hellip;</button>
      <button id="saveBtn">Simpan</button>
      <button id="helpBtn" class="ghost" title="Bantuan" aria-label="Bantuan">?</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="split">
    <aside class="pane">
      <div class="listhead">
        <input class="search" id="q" type="search" placeholder="Cari nama, handle, email, catatan&hellip;" aria-label="Cari channel">
        <div class="chips" id="chips"></div>
        <div class="sortrow">
          <select class="sortsel" id="sort" aria-label="Urutkan">
            <option value="none">Urutan asli</option>
            <option value="subdesc">Sub terbanyak</option>
            <option value="subasc">Sub tersedikit</option>
            <option value="name">Nama A&ndash;Z</option>
          </select>
          <span class="count" id="count"></span>
        </div>
        <select class="sortsel" id="genreSel" aria-label="Saring genre">
          <option value="">Semua genre</option>
        </select>
        <div class="rangerow">
          <input class="rangein" id="minSub" type="number" min="0" step="1000" placeholder="min sub" aria-label="Subscriber minimum">
          <span>&ndash;</span>
          <input class="rangein" id="maxSub" type="number" min="0" step="1000" placeholder="max sub" aria-label="Subscriber maksimum">
          <button id="bandBtn" title="Isi rentang 5.000&ndash;20.000">5k&ndash;20k</button>
          <button id="bandClr" class="ghost" title="Kosongkan rentang" aria-label="Kosongkan rentang">&times;</button>
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="Daftar channel"></div>
    </aside>
    <section class="pane" id="detail"></section>
  </div>


</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,.csv" hidden>
<datalist id="genrelist"></datalist>

<script>
(function () {
  "use strict";

  var STATUSES = [
    ["Belum Dihubungi","s-neutral","d-"], ["Sudah Email","s-accent","d-accent"],
    ["Dibales","s-good","d-good"], ["Tidak Dibales","s-warn","d-warn"],
    ["Minta Bayaran","s-warn","d-warn"], ["Setuju Gratis","s-good","d-good"],
    ["Sudah Main","s-good","d-good"], ["SIMPAN NANTI","s-neutral","d-"], ["SKIP","s-stop","d-stop"]
  ];
  var PAYS = [["Belum Tahu","s-neutral"], ["Tidak","s-good"], ["Ya","s-warn"]];
  var CURRENCIES = ["","USD","EUR","GBP","IDR","CNY"];
  var GENRES = ["Roguelite","Survivors-like","Deckbuilder","Strategy","Simulation","Tycoon/Manajemen",
                "RPG","Horror","Puzzle","Platformer","Metroidvania","Shooter","Sandbox/Crafting",
                "Naratif","Kartu/Board","Idle/Incremental","Retro","Variety"];
  var GENRE_HINTS = [
    ["Survivors-like", /survivor.?like|bullet ?heaven|auto.?shooter|vampire survivors/i],
    ["Roguelite",      /roguel(ik|it)e|rogue.?lik|rogue.?lit/i],
    ["Deckbuilder",    /deck.?build|slay the spire|card battler/i],
    ["Kartu/Board",    /board ?game|card game|tabletop/i],
    ["Strategy",       /strategy|strategi|\b4x\b|\brts\b|tactic|wargame/i],
    ["Tycoon/Manajemen", /tycoon|management|manajemen|colony|city.?build|factory/i],
    ["Simulation",     /simulation|simulator|\bsim\b/i],
    ["Horror",         /horror|scary|creepy|survival horror/i],
    ["Puzzle",         /puzzle|teka.?teki/i],
    ["Metroidvania",   /metroidvania/i],
    ["Platformer",     /platformer|precision platform/i],
    ["RPG",            /\brpg\b|role.?playing|\bjrpg\b|\bcrpg\b/i],
    ["Shooter",        /\bfps\b|shooter|boomer shooter/i],
    ["Sandbox/Crafting", /sandbox|crafting|base.?build|survival craft/i],
    ["Naratif",        /narrative|story.?rich|visual novel|adventure game/i],
    ["Idle/Incremental", /idle|incremental|clicker/i],
    ["Retro",          /retro|\bdos\b|classic games|old.?school/i],
    ["Variety",        /variety|let.?s play|lets play|indie games/i]
  ];
  function guessGenre(text) {
    var t = String(text || ""), hit = [];
    GENRE_HINTS.forEach(function (g) { if (g[1].test(t) && hit.indexOf(g[0]) === -1) hit.push(g[0]); });
    return hit.slice(0, 4).join(", ");
  }
  function genreList(r) {
    return String(r.genre || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  }
  var FIELDS = ["nama","link","sub","negara","fokus","genre","sumber","email","kontak","status","followup","bayaran","harga","mata","catatan"];
  var HEADERS = ["Nama Channel","Link Channel","Subscriber","Negara","Fokus Konten","Genre","Sumber","Email","Kontak Lain",

  /* ---------- kunci sebelum nulis ke repo ----------
     Yang disimpan cuma hash SHA-256, jadi sandinya sendiri nggak kebaca di source.
     Ini penghalang buat orang iseng, BUKAN keamanan sungguhan: halaman ini publik,
     dan siapa pun yang paham devtools bisa lewatin. Yang beneran ngunci repo kamu
     tetap token GitHub, dan token itu cuma ada di browser kamu sendiri. ---------- */

  var PASS_HASH = "8d1a758f28d0f1c202cd2a951dbed66f865a719d20b0313976e44c3e0bfe5ff5";

  function sha256Hex(s) {
    if (!(window.crypto && crypto.subtle)) return Promise.resolve(null);
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
      var b = new Uint8Array(buf), out = "";
      for (var i = 0; i < b.length; i++) out += ("0" + b[i].toString(16)).slice(-2);
      return out;
    });
  }

  function askPass(then) {
    sheet(function (box, close) {
      var h2 = el("h2"); h2.textContent = "Konfirmasi sandi";
      var p1 = el("p");
      p1.textContent = "Masukin sandi buat nyimpan ke repo. Ditanya tiap kali simpan.";
      var inp = el("input", "in mono", { type: "password", placeholder: "sandi", "aria-label": "Sandi" });
      var foot = el("div", "sheetfoot");
      var c = el("button", "ghost"); c.textContent = "Batal";
      var ok = el("button", "primary"); ok.textContent = "Lanjut";
      c.addEventListener("click", close);

      function submit() {
        var v = inp.value;
        if (!v) { toast("Sandinya masih kosong."); return; }
        ok.disabled = true;
        sha256Hex(v).then(function (hex) {
          ok.disabled = false;
          if (hex === null) { toast("Browser ini nggak dukung pengecekan sandi."); return; }
          if (hex !== PASS_HASH) { inp.value = ""; inp.focus(); toast("Sandinya salah."); return; }
          close(); then();

      ok.addEventListener("click", submit);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });

      box.appendChild(h2); box.appendChild(p1);
      box.appendChild(field("Sandi", inp)); box.appendChild(foot);
      foot.appendChild(c); foot.appendChild(ok);

  /* ---------- simpan ke repo lewat GitHub API ---------- */

  }

  function ghAsk(then) {
    sheet(function (box, close) {
      var h2 = el("h2"); h2.textContent = "Simpan ke repo GitHub";

      var p3 = el("p");
      p3.textContent = "Token disimpan cuma di browser kamu, nggak pernah masuk ke repo. Tiap orang di tim pakai tokennya sendiri.";

      var tokIn = el("input", "in mono", { type: "password", placeholder: "github_pat_…", "aria-label": "Token" });

        var t = tokIn.value.trim();

  function ghCommit(repo, token) {
    var url = "https://api.github.com/repos/" + repo + "/contents/data.json";

      .then(function (r) { return r.status === 404 ? { sha: null } : r.json(); })
      .then(function (info) {

        return fetch(url, { method: "PUT", headers: head, body: JSON.stringify(body) })

  /* ---------- csv ---------- */

  function esc(v) { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  function toCSV() {
    var out = [HEADERS.join(",")];
    rows.forEach(function (r) { out.push(FIELDS.map(function (f) { return esc(r[f]); }).join(",")); });
    return "﻿" + out.join("\r\n");
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    var out = [], row = [], cur = "", q = false, i = 0;
    while (i < text.length) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i+1] === '"') { cur += '"'; i += 2; continue; } q = false; i++; continue; }
        cur += c; i++; continue;
      }
      if (c === '"') { q = true; i++; continue; }
      if (c === ",") { row.push(cur); cur = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(cur); out.push(row); row = []; cur = ""; i++; continue; }
      cur += c; i++;
    }
    if (cur !== "" || row.length) { row.push(cur); out.push(row); }
    if (!out.length) return [];
    var head = out[0];
    return out.slice(1).filter(function (r) { return r.some(function (v) { return v !== ""; }); })
      .map(function (r) {
        var o = {}; head.forEach(function (h, i2) { o[String(h).trim()] = r[i2] == null ? "" : r[i2]; });
        return fromObj(o);
      });
  }
  function mergeFill(list) {
    var byKey = {}, added = 0, filled = 0, untouched = 0;
    rows.forEach(function (r) { byKey[keyOf(r)] = r; });
    list.forEach(function (src) {
      var k = keyOf(src), cur = byKey[k];
      if (!cur) { byKey[k] = src; rows.push(src); added++; return; }
      var changed = false;
      FIELDS.forEach(function (f) {
        if (f === "status" || f === "bayaran") return;
        var a = String(cur[f] == null ? "" : cur[f]).trim();
        var b = String(src[f] == null ? "" : src[f]).trim();
        if (!a && b) { cur[f] = src[f]; changed = true; }
      });
      if (changed) filled++; else untouched++;
    });
    return { added: added, filled: filled, untouched: untouched };
  }

  function merge(list) {
    var have = keyset(), added = 0, skipped = 0;
    list.forEach(function (r) {
      var k = keyOf(r);
      if (have[k]) { skipped++; return; }
      have[k] = true; rows.push(r); added++;
    });
    return { added:added, skipped:skipped };
  }

  function openFile() {
    if (window.showOpenFilePicker) {
      window.showOpenFilePicker({ types:[{ description:"Database", accept:{ "application/json":[".json"], "text/csv":[".csv"] } }] })
        .then(function (hs) {

  }
  function intake(name, text, handle) {

      if (!list.length) { toast("File-nya kosong atau formatnya nggak kebaca."); return; }
      if (isCsv) {
        var m = merge(list);
        toast(m.added + " baru ditambah, " + m.skipped + " duplikat dilewati.");
      } else {
        rows = list;
        if (handle) { fileHandle = handle; idb("readwrite", function (st) { return st.put(handle, "file"); }); }
        toast(list.length + " baris dimuat dari " + name + ".");

  var KONTAK_POLA = [
    ["Discord",  /(?:https?:\/\/)?(?:www\.)?discord(?:\.gg|app\.com\/invite)\/[A-Za-z0-9\-]+/i],
    ["X",        /(?:https?:\/\/)?(?:www\.)?(?:twitter|x)\.com\/[A-Za-z0-9_]{2,15}/i],
    ["Linktree", /(?:https?:\/\/)?(?:www\.)?linktr\.ee\/[A-Za-z0-9_.\-]+/i],
    ["Telegram", /(?:https?:\/\/)?(?:www\.)?t\.me\/[A-Za-z0-9_]+/i],
    ["Bluesky",  /(?:https?:\/\/)?(?:www\.)?bsky\.app\/profile\/[A-Za-z0-9_.\-]+/i],
    ["Twitch",   /(?:https?:\/\/)?(?:www\.)?twitch\.tv\/[A-Za-z0-9_]+/i],
    ["Instagram",/(?:https?:\/\/)?(?:www\.)?instagram\.com\/[A-Za-z0-9_.]+/i]

  function findKontak(desc) {
    var t = String(desc || ""), out = [];
    KONTAK_POLA.forEach(function (k) {
      var m = t.match(k[1]);

    });
    return out.slice(0, 4).join("  ·  ");
  }

  /* ---------- manen email dari deskripsi channel ----------
     Tombol "View email address" di YouTube dikunci CAPTCHA dan nggak ada di API.
     Tapi banyak kreator nulis alamatnya terang-terangan di deskripsi channel,
     dan deskripsi ITU dikasih API. Di situ kita manen. ---------- */

  var EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,12}/g;
  var EMAIL_BAD = /\.(png|jpe?g|gif|webp|svg|mp4|webm)$/i;
  var EMAIL_NEAR = /(business|inquir|enquir|contact|kontak|bisnis|sponsor|press|promo|kerjasama|booking|partnership)/i;

  // "nama (at) gmail (dot) com" -> "nama@gmail.com"
  function deobfuscate(t) {
    return String(t || "")
      .replace(/\s*[\(\[\{]\s*at\s*[\)\]\}]\s*/gi, "@")
      .replace(/\s+at\s+(?=[A-Za-z0-9.\-]+\s*[\(\[\{]?\s*dot)/gi, "@")
      .replace(/\s*[\(\[\{]\s*dot\s*[\)\]\}]\s*/gi, ".")
      .replace(/\s+dot\s+(?=[A-Za-z]{2,12}\b)/gi, ".");
  }

  function findEmail(desc) {
    var text = deobfuscate(desc);
    var hits = text.match(EMAIL_RE);
    if (!hits) return "";
    var seen = {}, clean = [];
    hits.forEach(function (e) {
      e = e.replace(/[.,;:]+$/, "");
      var low = e.toLowerCase();
      if (EMAIL_BAD.test(low) || seen[low]) return;
      seen[low] = 1; clean.push(e);
    });
    if (!clean.length) return "";
    // Utamakan yang ditulis dekat kata "business", "contact", dan sejenisnya.
    for (var i = 0; i < clean.length; i++) {
      var at = text.indexOf(clean[i]);
      if (at > -1 && EMAIL_NEAR.test(text.slice(Math.max(0, at - 90), at))) return clean[i];
    }
    return clean[0];
  }

    var n = num(r.sub);
    var tag = n > 200000 ? "DI ATAS 200k" : "";
    var base = String(r.catatan || "").replace(/Arsip itch\.io - sub & fokus BELUM dicek/i, "").replace(/Ditambah lewat Scan - belum diverifikasi/i, "").trim();

  function readSnap() { try { var s = localStorage.getItem(LS_SNAP); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function writeSnap(m) { try { localStorage.setItem(LS_SNAP, JSON.stringify(m)); } catch (e) {} }

  function syncShared(list) {
    var snap = readSnap();
    var first = !snap;
    snap = snap || {};
    var byKey = {}; rows.forEach(function (r) { byKey[keyOf(r)] = r; });
    var added = 0, updated = 0, next = {};

    list.forEach(function (src) {
      var k = keyOf(src);
      next[k] = {};
      REF_FIELDS.concat(WORK_FIELDS).forEach(function (f) { next[k][f] = src[f]; });

      var cur = byKey[k];
      if (!cur) { rows.push(src); added++; return; }

      var old = snap[k] || {}, changed = false;

      REF_FIELDS.forEach(function (f) {
        var a = String(cur[f] == null ? "" : cur[f]);
        var b = String(src[f] == null ? "" : src[f]);
        var o = String(old[f] == null ? "" : old[f]);
        // Pertama kali sinkron: kolom rujukan ikut data tim.
        // Berikutnya: cuma diperbarui kalau kamu belum pernah ngubah nilainya.
        if (first || a === o || !a.trim()) { if (a !== b) { cur[f] = src[f]; changed = true; } }
      });

      WORK_FIELDS.forEach(function (f) {
        var a = String(cur[f] == null ? "" : cur[f]).trim();
        var b = String(src[f] == null ? "" : src[f]).trim();
        var isDefault = (f === "status" && a === "Belum Dihubungi") || (f === "bayaran" && a === "Belum Tahu");
        if ((!a || isDefault) && b) { cur[f] = src[f]; changed = true; }
      });

      if (changed) updated++;
    });

    writeSnap(next);
    return { added: added, updated: updated };
  }

        var bits = [];
        if (m.added) bits.push(m.added + " channel baru");
        if (m.updated) bits.push(m.updated + " baris diperbarui");
        if (bits.length) toast("Data tim disinkronkan: " + bits.join(", ") + ". Isian kamu nggak diubah.");
        else if (!silent) toast("Udah paling baru \u2014 nggak ada yang berubah.");
      })["catch"](function () {
        if (!silent) toast("data.json nggak ketemu di folder yang sama sama index.html.");
        renderAll();
      });
  }
  document.getElementById("sharedBtn").addEventListener("click", function () { loadShared(false); });

  (function () {
    var dl = document.getElementById("genrelist");
    GENRES.forEach(function (g) { var o = el("option"); o.value = g; dl.appendChild(o); });
  })();

  rows = readLocal() || [];
  renderAll();
  paintStatus();
  loadShared(true);
  checkVersion();
  idb("readonly", function (st) { return st.get("file"); }).then(function (h) {
    if (h) fileHandle = h;
  });

})();
</script>
</body>
</html>
